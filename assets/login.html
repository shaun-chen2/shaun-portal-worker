<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>陈帅帅 · 常用网页总览</title>
  <style>/*STYLES*/</style>
</head>
<body>
  <section class="login-wrap">
    <form id="loginForm" class="login-card" autocomplete="on">
      <div class="logo">★</div>
      <h1>常用网页总览</h1>
      <p class="sub">登录后查看你的书签与常用站点</p>
      <input id="username" type="text" placeholder="用户名" autocomplete="username" required />
      <input id="password" type="password" placeholder="密码" autocomplete="current-password" required />
      <!-- 人机验证：Cloudflare Turnstile（sitekey 为公开标识，可放在页面里） -->
      <div class="ts-wrap"><div class="cf-turnstile" data-sitekey="0x4AAAAAAGKGiUaR0DzUbDRO" data-theme="dark" data-language="zh-cn" data-size="flexible"></div></div>
      <button type="submit" id="loginBtn">登 录</button>
      <p id="loginError" class="error" hidden>用户名或密码错误</p>
      <p class="alt"><a href="/register">没有账号？注册一个</a></p>
    </form>
  </section>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    const errEl = document.getElementById("loginError");
    // 取 Turnstile token（隐式渲染会把 token 写进该隐藏域）
    function tsToken() {
      const el = document.querySelector('input[name="cf-turnstile-response"]');
      return el ? el.value : "";
    }
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const btn = document.getElementById("loginBtn");
      errEl.hidden = true;
      // 没有 token 也照样提交：由服务端判定，客户端不阻断
      // （组件被网络/插件拦截时，至少还能拿到服务端明确的错误，而不是卡在原地）
      const token = tsToken();
      btn.disabled = true;
      btn.textContent = "校验中…";
      try {
        const r = await fetch("/login", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ username, password, cfToken: token }),
        });
        if (r.ok) {
          location.href = "/";
          return;
        }
        const j = await r.json().catch(() => ({}));
        errEl.textContent = j.error === "captcha" ? "人机验证未通过，请刷新页面后重试" : "用户名或密码错误";
        errEl.hidden = false;
        if (j.error === "captcha" && window.turnstile) window.turnstile.reset();
      } catch (e) {
        errEl.textContent = "网络错误，请重试";
        errEl.hidden = false;
      } finally {
        btn.disabled = false;
        btn.textContent = "登 录";
      }
    });
  </script>
</body>
</html>
